services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    image: mukhlis:latest
    container_name: mukhlis
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - HOSTNAME=0.0.0.0
      - PORT=3000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - mukhlis

networks:
  mukhlis:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
