services:
  nginx:
    image: nginx:1.27-alpine
    container_name: mukhlis-nginx
    restart: unless-stopped
    depends_on:
      certbot-init:
        condition: service_completed_successfully
      nextjs:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - NGINX_HOST=${NGINX_HOST:-ahmadullahmukhlis.com}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mukhlis

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    image: mukhlis:latest
    container_name: mukhlis
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - HOSTNAME=0.0.0.0
      - PORT=3000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - mukhlis

  certbot-init:
    image: certbot/certbot:latest
    container_name: mukhlis-certbot-init
    network_mode: none
    environment:
      - NGINX_HOST=${NGINX_HOST:-ahmadullahmukhlis.com}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        cert_dir="/etc/letsencrypt/live/$${NGINX_HOST}"
        mkdir -p "$${cert_dir}"
        if [ ! -s "$${cert_dir}/fullchain.pem" ] || [ ! -s "$${cert_dir}/privkey.pem" ]; then
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$${cert_dir}/privkey.pem" \
            -out "$${cert_dir}/fullchain.pem" \
            -subj "/CN=$${NGINX_HOST}"
          cp "$${cert_dir}/fullchain.pem" "$${cert_dir}/chain.pem"
        fi

  certbot:
    image: certbot/certbot:latest
    container_name: mukhlis-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;
    profiles:
      - ssl
    networks:
      - mukhlis

networks:
  mukhlis:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
